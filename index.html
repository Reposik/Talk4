<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>T4 MESSENGER</title>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
    <style>
        :root { --red: #ff0000; --black: #000; --white: #fff; }
        * { box-sizing: border-box; outline: none; }
        body { background: var(--black); color: var(--white); font-family: 'Dela Gothic One', cursive; margin: 0; }

        /* AUTH SCREEN */
        #auth-page {
            position: fixed; inset: 0; background: var(--black); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .auth-form { width: 320px; display: flex; flex-direction: column; gap: 15px; }
        .t4-input { 
            background: transparent; border: 2px solid var(--white); border-radius: 50px; 
            padding: 12px 20px; color: white; font-family: inherit;
        }
        .t4-submit { 
            background: var(--red); border: none; padding: 15px; border-radius: 50px; 
            color: white; font-family: inherit; cursor: pointer; font-size: 1.1rem;
        }

        /* MAIN APP */
        .app-grid { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
        .sidebar { border-right: 1px solid #222; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-size: 1.5rem; color: var(--red); border-bottom: 1px solid #222; }
        
        .chat-area { display: flex; flex-direction: column; background: #050505; }
        .msg-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        /* INPUT AREA (As per your request) */
        .input-wrap { padding: 20px; display: flex; align-items: center; gap: 10px; }
        .pill-input { 
            flex: 1; background: var(--black); border: 2px solid var(--white); 
            border-radius: 50px; padding: 12px 25px; color: white; font-family: inherit;
        }
        .clip { 
            width: 40px; height: 40px; border: 2px solid var(--white); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        .msg { padding: 10px 20px; border-radius: 20px; max-width: 70%; font-size: 0.9rem; }
        .msg.me { align-self: flex-end; background: var(--red); color: white; }
        .msg.other { align-self: flex-start; background: #222; }
        
        .switch-auth { font-size: 0.7rem; text-align: center; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

<div id="auth-page">
    <h1 style="color: var(--red); margin-bottom: 30px;">T4 LOGIN</h1>
    <div class="auth-form" id="login-form">
        <input type="email" id="email" class="t4-input" placeholder="EMAIL">
        <input type="password" id="pass" class="t4-input" placeholder="PASSWORD">
        <button class="t4-submit" onclick="performAuth('login')">ВОЙТИ</button>
        <p class="switch-auth" onclick="toggleAuth()">Нет аккаунта? Регистрация</p>
    </div>
</div>

<div class="app-grid" id="main-app" style="display: none;">
    <div class="sidebar">
        <div class="sidebar-header">T4 CHATS</div>
        <div id="user-list" style="padding: 20px;">
            <div style="color: var(--red)">● ONLINE</div>
        </div>
        <div style="margin-top: auto; padding: 20px; font-size: 2rem; border-top: 1px solid #222; cursor: pointer;">+</div>
    </div>

    <div class="chat-area">
        <div class="msg-container" id="messages"></div>
        <div class="input-wrap">
            <input type="text" id="msg-input" class="pill-input" placeholder="Введите сообщение..." onkeydown="if(event.key==='Enter') send()">
            <div class="clip">📎</div>
        </div>
    </div>
</div>

<script>
    // --- КОНФИГ ТВОЕГО ГИТХАБА (ЗАПОЛНИ ОДИН РАЗ) ---
    const GIST_KEY = "ТВОЙ_КЛЮЧ_ОТ_ГИСТА"; 
    const GIST_ID = "ID_ТВОЕГО_ГИСТА"; // Тот, где лежит gist.json

    let currentUser = null;

    // Переключение между Входом и Регистрацией
    function toggleAuth() {
        const title = document.querySelector('#auth-page h1');
        const btn = document.querySelector('.t4-submit');
        const switcher = document.querySelector('.switch-auth');
        
        if(title.innerText === "T4 LOGIN") {
            title.innerText = "T4 REGISTER";
            btn.innerText = "СОЗДАТЬ";
            switcher.innerText = "Уже есть аккаунт? Войти";
        } else {
            title.innerText = "T4 LOGIN";
            btn.innerText = "ВОЙТИ";
            switcher.innerText = "Нет аккаунта? Регистрация";
        }
    }

    async function performAuth(type) {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('pass').value;

        if(!email || !pass) return alert("Заполни поля!");

        // Имитация базы через Gist (для простоты примера храним юзеров в отдельном файле или в том же)
        // В реальном T4 здесь будет fetch к твоему users.json на GitHub
        
        currentUser = email.split('@')[0].toUpperCase();
        document.getElementById('auth-page').style.display = 'none';
        document.getElementById('main-app').style.display = 'grid';
        
        startChat();
    }

    async function startChat() {
        load();
        setInterval(load, 4000);
    }

    async function load() {
        try {
            const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                headers: { 'Authorization': `token ${GIST_KEY}` }
            });
            const data = await res.json();
            const history = JSON.parse(data.files["gist.json"].content);
            render(history);
        } catch(e) { console.log("Ошибка загрузки"); }
    }

    function render(data) {
        const box = document.getElementById('messages');
        box.innerHTML = "";
        data.forEach(m => {
            const div = document.createElement('div');
            div.className = `msg ${m.u === currentUser ? 'me' : 'other'}`;
            div.innerText = m.t;
            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    }

    async function send() {
        const input = document.getElementById('msg-input');
        const text = input.value;
        if(!text) return;

        // Логика PATCH запроса к Gist (как в предыдущих шагах)
        // ... (код отправки)
        
        input.value = "";
    }
</script>
</body>
</html>
