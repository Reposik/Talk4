<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>T4 SYSTEM | CLOUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
    <style>
        :root { --red: #ff0000; --black: #000; --dark: #0a0a0a; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--black); color: white; font-family: 'Dela Gothic One', cursive; overflow: hidden; }

        /* ЭКРАН РЕГИСТРАЦИИ / ВХОДА */
        #auth-screen {
            position: fixed; inset: 0; background: var(--black); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 5px solid var(--red);
        }

        /* ОСНОВНОЙ ИНТЕРФЕЙС */
        .app { display: flex; height: 100vh; }
        
        /* Боковая панель (Твои эскизы) */
        .sidebar { width: 300px; border-right: 3px solid var(--black); background: #000; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; border-bottom: 2px solid #111; font-size: 1.2rem; text-align: center; }
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { padding: 20px; border-bottom: 1px solid #111; cursor: pointer; transition: 0.2s; }
        .chat-item:hover { background: var(--red); color: black; }
        .add-chat { height: 60px; border-top: 2px solid #111; display: flex; align-items: center; justify-content: center; font-size: 2rem; cursor: pointer; }

        /* Окно сообщений */
        .main { flex: 1; display: flex; flex-direction: column; background: #050505; position: relative; }
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        /* Поле ввода как на рисунке */
        .input-zone { padding: 20px; display: flex; align-items: center; gap: 15px; }
        .input-wrap { 
            flex: 1; background: #000; border: 2px solid white; border-radius: 50px; 
            padding: 10px 25px; display: flex; align-items: center;
        }
        .input-wrap input { 
            flex: 1; background: transparent; border: none; color: white; 
            font-family: inherit; font-size: 1rem; outline: none;
        }
        .attach-btn { width: 30px; height: 30px; border: 2px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.8rem; }

        .msg { padding: 12px 18px; border-radius: 20px; max-width: 70%; font-size: 0.9rem; border: 1px solid var(--red); }
        .msg.me { align-self: flex-end; background: var(--red); color: black; }
        .msg.other { align-self: flex-start; background: #111; }

        .btn-t4 { background: var(--red); border: none; color: white; padding: 15px 30px; font-family: inherit; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div id="auth-screen">
    <h1 style="color: var(--red); font-size: 3.5rem; margin: 0;">T4 LOGIN</h1>
    <input type="text" id="reg-user" placeholder="USERNAME" style="background:transparent; border:2px solid var(--red); color:white; padding:15px; width:300px; font-family:inherit; text-align:center; margin-top:20px;">
    <input type="password" id="reg-key" placeholder="GIST_KEY (TOKEN)" style="background:transparent; border:2px solid var(--red); color:white; padding:15px; width:300px; font-family:inherit; text-align:center; margin-top:10px;">
    <input type="text" id="reg-gist" placeholder="GIST_ID" style="background:transparent; border:2px solid var(--red); color:white; padding:15px; width:300px; font-family:inherit; text-align:center; margin-top:10px;">
    <button class="btn-t4" onclick="login()">ENTER SYSTEM</button>
</div>

<div class="app">
    <div class="sidebar">
        <div class="sidebar-header">CHATS</div>
        <div class="chat-list" id="clist">
            <div class="chat-item">SYSTEM_BOT</div>
        </div>
        <div class="add-chat" onclick="alert('SEARCHING USERS...')">+</div>
    </div>
    
    <div class="main">
        <div class="messages" id="m-box"></div>
        
        <div class="input-zone">
            <div class="input-wrap">
                <input type="text" id="msg-in" placeholder="Введите сообщение" onkeydown="if(event.key==='Enter') send()">
            </div>
            <div class="attach-btn">📎</div>
        </div>
    </div>
</div>

<script>
    let STATE = { user: "", key: "", gist: "" };

    // НОРМАЛЬНЫЙ ВХОД (СОХРАНЯЕТ В ПАМЯТЬ)
    function login() {
        STATE.user = document.getElementById('reg-user').value;
        STATE.key = document.getElementById('reg-key').value;
        STATE.gist = document.getElementById('reg-gist').value;

        if(!STATE.user || !STATE.key || !STATE.gist) return alert("ЗАПОЛНИ ВСЕ ПОЛЯ, АЗЕР");

        // Сохраняем сессию в браузере, чтобы не вводить каждый раз
        localStorage.setItem('t4_session', JSON.stringify(STATE));
        
        document.getElementById('auth-screen').style.display = 'none';
        startSync();
    }

    // Авто-вход при перезагрузке
    window.onload = () => {
        const saved = localStorage.getItem('t4_session');
        if(saved) {
            STATE = JSON.parse(saved);
            document.getElementById('auth-screen').style.display = 'none';
            startSync();
        }
    }

    async function startSync() {
        await sync();
        setInterval(sync, 4000);
    }

    async function sync() {
        try {
            const res = await fetch(`https://api.github.com/gists/${STATE.gist}`, {
                headers: { 'Authorization': `token ${STATE.key}` }
            });
            const data = await res.json();
            const history = JSON.parse(data.files["gist.json"].content);
            render(history);
        } catch(e) { console.log("SYNC_ERROR"); }
    }

    function render(data) {
        const box = document.getElementById('m-box');
        box.innerHTML = "";
        data.forEach(m => {
            const div = document.createElement('div');
            div.className = `msg ${m.u === STATE.user ? 'me' : 'other'}`;
            div.innerText = m.t;
            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    }

    async function send() {
        const el = document.getElementById('msg-in');
        const text = el.value;
        if(!text) return;

        const res = await fetch(`https://api.github.com/gists/${STATE.gist}`, {
            headers: { 'Authorization': `token ${STATE.key}` }
        });
        const data = await res.json();
        let history = JSON.parse(data.files["gist.json"].content);

        history.push({ u: STATE.user, t: text });

        await fetch(`https://api.github.com/gists/${STATE.gist}`, {
            method: 'PATCH',
            headers: { 'Authorization': `token ${STATE.key}` },
            body: JSON.stringify({
                files: { "gist.json": { content: JSON.stringify(history) } }
            })
        });

        el.value = "";
        sync();
    }
</script>
</body>
</html>
